name: G1b Android and Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - project.godot
      - export_presets.cfg
      - scenes/**
      - scripts/**
      - .github/workflows/g1b-build.yml

permissions:
  contents: read

concurrency:
  group: g1b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.7.2
      ANDROID_BUILD_TOOLS: 36.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android platform and signing tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Install official Godot Standard and matching export templates
        run: |
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --silent --show-error "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --silent --show-error "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          unzip -q "$RUNNER_TEMP/templates.tpz" \
            templates/version.txt templates/android_debug.apk templates/android_release.apk \
            templates/windows_debug_x86_64.exe templates/windows_release_x86_64.exe \
            -d "$RUNNER_TEMP/godot-templates"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$template_dir/"
          test "$(cat "$template_dir/version.txt")" = "${GODOT_VERSION}.stable"

      - name: Configure Android SDK paths and temporary debug signing
        run: |
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path.home() / '.config/godot/editor_settings-4.7.tres'
          config.write_text(
              '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
              f'export/android/java_sdk_path = "{os.environ["JAVA_HOME"]}"\n'
              f'export/android/android_sdk_path = "{os.environ["ANDROID_HOME"]}"\n'
          )
          PY
          debug_password="$(openssl rand -hex 32)"
          echo "::add-mask::$debug_password"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$debug_password"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/invariant-debug.keystore" \
            -storetype JKS -alias invariant-debug -keyalg RSA -keysize 2048 -validity 365 \
            -dname 'CN=INVARIANT Debug' \
            -storepass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD \
            -keypass:env GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/invariant-debug.keystore"
            echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=invariant-debug'
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$debug_password"
          } >> "$GITHUB_ENV"

      - name: Import G1a in Godot 4.7.2 and run headless
        run: |
          mkdir -p build/logs build/android build/windows
          godot --version | tee build/logs/godot-version.txt
          godot --version | grep -E '^4\.7\.2\.stable\.official\.'
          godot --headless --path . --editor --import --quit 2>&1 | tee build/logs/import.log
          godot --headless --path . --quit-after 60 2>&1 | tee build/logs/start.log
          if grep -E '(^ERROR:|SCRIPT ERROR:|Parse Error:)' build/logs/import.log build/logs/start.log; then exit 1; fi

      - name: Export Android debug APK
        run: |
          godot --headless --path . --export-debug 'Android Debug' build/android/INVARIANT-debug.apk 2>&1 | tee build/logs/android-export.log
          test -s build/android/INVARIANT-debug.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs build/android/INVARIANT-debug.apk | tee build/logs/android-signature.txt
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging build/android/INVARIANT-debug.apk | tee build/logs/android-badging.txt
          grep -F "native-code: 'arm64-v8a'" build/logs/android-badging.txt
          grep -F "package: name='io.github.nozomit01.invariant.debug'" build/logs/android-badging.txt
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump xmltree build/android/INVARIANT-debug.apk AndroidManifest.xml > build/logs/android-manifest.txt
          grep -E 'screenOrientation.*=0x0$' build/logs/android-manifest.txt

      - name: Export Windows x86_64 EXE
        run: |
          godot --headless --path . --export-debug 'Windows Desktop' build/windows/INVARIANT.exe 2>&1 | tee build/logs/windows-export.log
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path('build/windows/INVARIANT.exe').read_bytes()
          assert data[:2] == b'MZ', 'Missing Windows executable'
          pe = struct.unpack_from('<I', data, 0x3c)[0]
          assert data[pe:pe+4] == b'PE\0\0', 'Invalid PE header'
          assert struct.unpack_from('<H', data, pe+4)[0] == 0x8664, 'Expected x86_64'
          print('Verified Windows PE x86_64 executable')
          PY
          (cd build/windows && zip -9 ../INVARIANT-windows-x86_64.zip INVARIANT.exe)
          unzip -t build/INVARIANT-windows-x86_64.zip

      - name: Record checksums and reject export errors
        run: |
          if grep -E '(^ERROR:|SCRIPT ERROR:|Parse Error:)' build/logs/*export.log; then exit 1; fi
          sha256sum build/android/INVARIANT-debug.apk build/INVARIANT-windows-x86_64.zip | tee build/logs/SHA256SUMS.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INVARIANT-Android-debug-arm64
          path: build/android/INVARIANT-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows ZIP with EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INVARIANT-Windows-x86_64
          path: build/INVARIANT-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: INVARIANT-build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/invariant-debug.keystore"
